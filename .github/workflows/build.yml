name: Build and Release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore UaskusTweaks/UaskusTweaks.csproj

      - name: Check catalog and command error handling (no system tweaks applied)
        run: dotnet run --project tests/UaskusTweaks.Checks -c Release

      - name: Determine build version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' UaskusTweaks/UaskusTweaks.csproj | head -1)
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish single-file executable
        run: >
          dotnet publish UaskusTweaks/UaskusTweaks.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Smoke test published executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD\publish\UaskusTweaks.exe" `
            -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            $logPath = Join-Path $env:TEMP 'uaskus_debug.log'
            if (Test-Path -LiteralPath $logPath) {
              Get-Content -LiteralPath $logPath
            }
            throw "Startup smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UaskusTweaks-exe
          path: publish/UaskusTweaks.exe

      - name: Audit tweak availability without applying changes
        shell: powershell
        run: ./scripts/Test-Tweaks.ps1 -ExecutablePath ./publish/UaskusTweaks.exe -ReportPath ./tweak-audit.json
        continue-on-error: true

      - name: Upload read-only audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tweak-audit
          path: tweak-audit.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Uaskus Tweaker - WPF Edition

          Modern WPF GUI application replacing the original batch-file tool.

          ### Features
          - Professional dark-themed graphical interface
          - One-click performance, privacy, and gaming optimizations
          - 87 Windows tweaks with descriptions and risk indicators
          - Automatic system restore point creation before applying changes
          - Built-in logging and undo support

          ### Requirements
          - Windows 10 or Windows 11 (64-bit)
          - Administrator privileges
          - No additional runtime required (self-contained executable)

          ### How to Use
          1. Download **UaskusTweaks.exe** and run it
          2. Click **Yes** when the admin prompt appears
          3. Select the tweaks you want to apply and click **Apply**
          4. Future updates are offered automatically when the app starts

          ### Download
          - **UaskusTweaks.exe** - No installation or extraction needed
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" publish/UaskusTweaks.exe --clobber
            gh release edit "$TAG" \
              --title "Uaskus Tweaker $TAG - WPF Edition" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG" publish/UaskusTweaks.exe \
              --verify-tag \
              --title "Uaskus Tweaker $TAG - WPF Edition" \
              --notes-file release-notes.md \
              --latest
          fi
