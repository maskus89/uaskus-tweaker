name: Build and Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore UaskusTweaks/UaskusTweaks.csproj

      - name: Publish single-file executable
        run: >
          dotnet publish UaskusTweaks/UaskusTweaks.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UaskusTweaks-exe
          path: publish/UaskusTweaks.exe

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete v2.0.0 --yes 2>/dev/null || true
          git push origin :refs/tags/v2.0.0 2>/dev/null || true
          gh release create v2.0.0 publish/UaskusTweaks.exe \
            --title "Uaskus Tweaker v2.0.0 - WPF Edition" \
            --notes "## Uaskus Tweaker v2.0.0 - WPF Edition

Modern WPF GUI application replacing the original batch-file tool.

### What's New
- Professional dark-themed graphical interface
- One-click performance, privacy, and gaming optimizations
- 100+ Windows tweaks with descriptions and risk indicators
- Automatic system restore point creation before applying changes
- Built-in logging and undo support

### Requirements
- Windows 10 or Windows 11 (64-bit)
- Administrator privileges
- No additional runtime required (self-contained executable)

### How to Use
1. Download **UaskusTweaks.exe**
2. Right-click → **Run as administrator**
3. Select the tweaks you want to apply and click **Apply**" \
            --latest
